<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polyline / Path 坐标推演器</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --accent: #00E5FF;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 16px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .layout { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .left, .right { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .canvas-wrap { position: relative; }
  canvas { background: #010409; border: 1px solid var(--border); border-radius: 4px; cursor: crosshair; display: block; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .hint b { color: var(--accent); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #001015; font-weight: 600; }
  label { font-size: 12px; color: var(--muted); }
  input[type=number] {
    width: 64px; background: #010409; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px;
  }
  .right { min-width: 340px; flex: 1; }
  .points-list { list-style: none; margin: 8px 0; padding: 0; max-height: 220px; overflow-y: auto; }
  .points-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 4px; font-size: 12px;
  }
  .points-list .coord { color: var(--accent); font-family: Consolas, monospace; margin-right: 4px; }
  .points-list input[type=number] { width: 52px; font-size: 12px; padding: 3px 5px; }
  .points-list button { padding: 2px 8px; font-size: 11px; }
  .code-box {
    background: #010409; border: 1px solid var(--border); border-radius: 5px;
    padding: 10px; font-family: Consolas, monospace; font-size: 13px; word-break: break-all; margin: 8px 0;
    min-height: 42px;
  }
  .code-box .tag { color: #7ee787; }
  .code-box .attr { color: #79c0ff; }
  .code-box .val { color: #ffa657; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .presets button { font-size: 12px; padding: 5px 10px; }
  .section-title { font-size: 13px; color: var(--muted); margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
  .status { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .status b { color: var(--accent); }
  .copy-ok { color: #7ee787 !important; }
  .small { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <h1>Polyline / Path 坐标推演器</h1>
  <div class="sub">点哪画哪，实时显示坐标，自动生成 WPF / SVG 的 Polyline 与 Path 代码。原点 (0,0) 在左上角，x 向右、y 向下。</div>

  <div class="layout">
    <!-- 左：画布 -->
    <div class="left">
      <div class="toolbar">
        <label>画布尺寸</label>
        <input type="number" id="canvasSize" value="400" min="10" max="800" step="10">
        <button onclick="resizeCanvas()">应用</button>
        <button onclick="undo()">撤销一点</button>
        <button onclick="clearAll()">清空</button>
        <label><input type="checkbox" id="snap" style="vertical-align:middle"> 吸附到 10px 网格</label>
      </div>
      <div class="canvas-wrap">
        <canvas id="cv" width="400" height="400"></canvas>
      </div>
      <div class="hint">在画布上 <b>单击</b> 依次添加顶点；移动鼠标看实时坐标；右侧可直接编辑每个点的 x、y。</div>
      <div class="status" id="status">当前坐标: <b>(0, 0)</b></div>
    </div>

    <!-- 右：控制 + 输出 -->
    <div class="right">
      <div class="section-title">预设模板（基于当前画布尺寸）</div>
      <div class="presets" id="presets"></div>

      <div class="section-title">顶点列表（可直接改数字）</div>
      <ul class="points-list" id="ptList"><li style="color:var(--muted)">还没有点，去左边画布点击添加</li></ul>

      <div class="section-title">Polyline 代码</div>
      <div class="code-box" id="codePoly">—</div>
      <div class="row">
        <button class="primary" onclick="copyPoints()">复制 Points 字符串</button>
        <button onclick="copyPolylineTag()">复制完整 Polyline 标签</button>
      </div>

      <div class="section-title">Path Data 代码（WPF Path / SVG path）</div>
      <div class="code-box" id="codePath">—</div>
      <div class="row">
        <button class="primary" onclick="copyPathData()">复制 Path Data</button>
        <button onclick="copyPathTag()">复制完整 Path 标签</button>
      </div>
      <div class="status" id="copyStatus"></div>

      <div class="section-title">预览（实时渲染）</div>
      <div class="code-box" style="background:#010409">
        <svg id="preview" width="100%" height="160" viewBox="0 0 400 160" preserveAspectRatio="xMinYMin meet"></svg>
      </div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  let SIZE = 400;
  let points = [];
  const ACCENT = '#00E5FF';

  function setupCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = SIZE + 'px';
    canvas.style.height = SIZE + 'px';
    canvas.width = SIZE * dpr;
    canvas.height = SIZE * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function resizeCanvas() {
    const v = parseInt(document.getElementById('canvasSize').value, 10);
    if (v >= 10 && v <= 800) SIZE = v;
    setupCanvas();
    renderCode(); renderPreview();
  }

  function snap(v) {
    return document.getElementById('snap').checked ? Math.round(v / 10) * 10 : Math.round(v);
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    // 网格
    ctx.strokeStyle = '#1c2128';
    ctx.lineWidth = 1;
    const step = SIZE > 200 ? 20 : 40;
    for (let g = 0; g <= SIZE; g += step) {
      ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, SIZE); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(SIZE, g); ctx.stroke();
    }
    // 主刻度线（每 100）
    ctx.strokeStyle = '#30363d';
    for (let g = 0; g <= SIZE; g += 100) {
      ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, SIZE); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(SIZE, g); ctx.stroke();
    }
    // 坐标轴标注
    ctx.fillStyle = '#8b949e';
    ctx.font = '10px monospace';
    for (let g = 0; g <= SIZE; g += 100) {
      if (g > 0) ctx.fillText(g, g + 2, 11);
      if (g > 0) ctx.fillText(g, 2, g - 2);
    }

    // 折线
    if (points.length > 0) {
      ctx.strokeStyle = ACCENT;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();
    }
    // 顶点
    points.forEach((p, i) => {
      ctx.fillStyle = ACCENT;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e6edf3';
      ctx.font = '11px monospace';
      ctx.fillText('P' + i + '(' + Math.round(p.x) + ',' + Math.round(p.y) + ')', p.x + 6, p.y - 6);
    });
  }

  function addPoint(e) {
    const rect = canvas.getBoundingClientRect();
    const x = snap(e.clientX - rect.left);
    const y = snap(e.clientY - rect.top);
    points.push({ x, y });
    draw(); renderList(); renderCode(); renderPreview();
  }
  canvas.addEventListener('click', addPoint);
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const x = snap(e.clientX - rect.left);
    const y = snap(e.clientY - rect.top);
    document.getElementById('status').innerHTML = '当前坐标: <b>(' + x + ', ' + y + ')</b>';
  });

  function undo() {
    points.pop();
    draw(); renderList(); renderCode(); renderPreview();
  }
  function clearAll() {
    points = [];
    draw(); renderList(); renderCode(); renderPreview();
  }
  function removePoint(i) {
    points.splice(i, 1);
    draw(); renderList(); renderCode(); renderPreview();
  }
  function updatePoint(i, axis, value) {
    const v = parseInt(value, 10);
    if (isNaN(v)) return;
    points[i][axis] = v;
    draw(); renderCode(); renderPreview();
  }

  function renderList() {
    const ul = document.getElementById('ptList');
    if (points.length === 0) { ul.innerHTML = '<li style="color:var(--muted)">还没有点，去左边画布点击添加</li>'; return; }
    ul.innerHTML = points.map((p, i) =>
      '<li>' +
        '<span class="coord">P' + i + '</span>' +
        '<span>x:<input type="number" value="' + p.x + '" onchange="updatePoint(' + i + ', \'x\', this.value)"></span>' +
        '<span>y:<input type="number" value="' + p.y + '" onchange="updatePoint(' + i + ', \'y\', this.value)"></span>' +
        '<button onclick="removePoint(' + i + ')">✕</button>' +
      '</li>'
    ).join('');
  }

  function pointsStr() {
    return points.map(p => p.x + ' ' + p.y).join(' ');
  }
  function pathData() {
    if (points.length === 0) return '';
    let d = 'M ' + points[0].x + ' ' + points[0].y;
    for (let i = 1; i < points.length; i++) d += ' L ' + points[i].x + ' ' + points[i].y;
    return d;
  }

  function renderCode() {
    const s = points.length ? pointsStr() : '0 0';
    document.getElementById('codePoly').innerHTML =
      '<span class="tag">&lt;Polyline</span> <span class="attr">Points</span>=<span class="val">"' + s + '"</span>\n' +
      '  <span class="attr">Stroke</span>=<span class="val">"#00E5FF"</span> <span class="attr">StrokeThickness</span>=<span class="val">"2"</span><span class="tag">/&gt;</span>';

    const d = pathData();
    document.getElementById('codePath').innerHTML =
      '<span class="tag">&lt;Path</span> <span class="attr">Data</span>=<span class="val">"' + (d || 'M 0 0') + '"</span>\n' +
      '  <span class="attr">Stroke</span>=<span class="val">"#00E5FF"</span> <span class="attr">StrokeThickness</span>=<span class="val">"2"</span><span class="tag">/&gt;</span>';
  }

  function renderPreview() {
    const svg = document.getElementById('preview');
    const d = pathData();
    svg.innerHTML = '<path d="' + (d || 'M 0 0') + '" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round"/>';
  }

  function copyPoints() {
    const s = points.length ? pointsStr() : '0 0';
    navigator.clipboard.writeText(s).then(() => flash('已复制 Points：' + s));
  }
  function copyPolylineTag() {
    const s = points.length ? pointsStr() : '0 0';
    navigator.clipboard.writeText('<Polyline Points="' + s + '" Stroke="#00E5FF" StrokeThickness="2"/>').then(() => flash('已复制完整 Polyline 标签'));
  }
  function copyPathData() {
    const d = pathData() || 'M 0 0';
    navigator.clipboard.writeText(d).then(() => flash('已复制 Path Data：' + d));
  }
  function copyPathTag() {
    const d = pathData() || 'M 0 0';
    navigator.clipboard.writeText('<Path Data="' + d + '" Stroke="#00E5FF" StrokeThickness="2"/>').then(() => flash('已复制完整 Path 标签'));
  }
  function flash(msg) {
    const el = document.getElementById('copyStatus');
    el.textContent = msg; el.className = 'status copy-ok';
    setTimeout(() => { el.textContent = ''; el.className = 'status'; }, 2000);
  }

  // 预设模板
  const presetDefs = [
    { name: '左上角·斜切', fn: s => [[0, s*0.75|0],[0, s*0.25|0],[s*0.25|0,0],[s*0.75|0,0]] },
    { name: '左上角·直角', fn: s => [[0, s*0.75|0],[0,0],[s*0.75|0,0]] },
    { name: '右上角·斜切', fn: s => [[s*0.25|0,0],[s,0],[s,s*0.25|0],[s,s*0.75|0]] },
    { name: '左下角·斜切', fn: s => [[0,s*0.25|0],[0,s],[s*0.25|0,s],[s*0.75|0,s]] },
    { name: '右下角·斜切', fn: s => [[s*0.25|0,s],[s,s],[s,s*0.25|0]] },
    { name: '四角框', fn: s => [[0,0],[s,0],[s,s],[0,s],[0,0]] },
    { name: '箭头→', fn: s => [[0,s*0.5|0],[s*0.7|0,s*0.5|0],[s*0.7|0,s*0.3|0],[s,s*0.5|0],[s*0.7|0,s*0.7|0],[s*0.7|0,s*0.5|0]] },
  ];
  function buildPresets() {
    document.getElementById('presets').innerHTML = presetDefs.map((p, i) =>
      '<button onclick="applyPreset(' + i + ')">' + p.name + '</button>').join('');
  }
  function applyPreset(i) {
    points = presetDefs[i].fn(SIZE).map(([x, y]) => ({ x, y }));
    draw(); renderList(); renderCode(); renderPreview();
  }

  // 初始化
  setupCanvas();
  buildPresets();
  renderList(); renderCode(); renderPreview();
</script>
</body>
</html>
